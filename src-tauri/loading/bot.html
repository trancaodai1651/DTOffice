<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Codex Bot</title>
<style>
  :root { color-scheme: dark; font: 11px/1.3 system-ui, sans-serif; color: #edf1ff; }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; height: 100%; background: transparent; overflow: hidden; user-select: none; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: end; padding: 6px 8px 12px; }
  button { color: inherit; font: inherit; cursor: pointer; border: 0; }
  #hide { position: absolute; right: 9px; top: 7px; width: 28px; height: 28px; border-radius: 50%; background: #202840e8; font-size: 19px; }
  #hide:not(:focus-visible) { opacity: 0; } body:hover #hide { opacity: 1; }
  #robot { width: 142px; height: 157px; padding: 0; background: transparent; cursor: grab; touch-action: none; filter: drop-shadow(0 5px 4px #11162955); }
  #robot:active { cursor: grabbing; }
  svg { width: 100%; height: 100%; overflow: visible; }
  .float { animation: float 3.4s ease-in-out infinite; transform-origin: 75px 85px; }
  .eye { fill: #afc8ff; } .arm { transform-box: fill-box; transform-origin: top center; }
  body[data-state="work"] .arm { animation: wave .7s ease-in-out infinite alternate; }
  body[data-state="wait"] .eye { fill: #ffd281; }
  #status { max-width: 100%; min-height: 30px; text-align: center; border-radius: 14px; background: #202840ed; padding: 6px 10px; box-shadow: 0 2px 5px #11162930; }
  #status:focus-visible, #robot:focus-visible, #hide:focus-visible { outline: 2px solid #a9bbff; outline-offset: -2px; }
  @keyframes float { 50% { transform: translateY(-5px) rotate(2deg); } }
  @keyframes wave { to { transform: rotate(-16deg); } }
  @media (prefers-reduced-motion: reduce) { *, .float { animation: none !important; } }
</style>
</head>
<body data-state="idle">
<button id="hide" type="button" hidden>×</button>
<button id="robot" type="button" aria-label="Codex Bot">
  <svg viewBox="0 0 150 166" aria-hidden="true">
    <defs><linearGradient id="blue" x2="0" y2="1"><stop stop-color="#8b9aff"/><stop offset="1" stop-color="#5365dd"/></linearGradient></defs>
    <g class="float">
      <rect x="50" y="101" width="50" height="43" rx="18" fill="url(#blue)"/>
      <rect class="arm" x="35" y="108" width="13" height="31" rx="7" fill="#5365dd" transform="rotate(13 42 108)"/>
      <rect class="arm" x="102" y="108" width="13" height="31" rx="7" fill="#5365dd" transform="rotate(-13 108 108)"/>
      <rect x="55" y="139" width="16" height="16" rx="7" fill="#5365dd"/><rect x="80" y="139" width="16" height="16" rx="7" fill="#5365dd"/>
      <path d="M32 90C10 86 10 60 28 54C19 36 38 21 52 29C56 9 82 8 91 25C109 15 126 29 121 44C146 47 144 76 128 82C133 102 104 112 92 101C72 117 39 111 32 90Z" fill="url(#blue)"/>
      <rect x="32" y="46" width="91" height="49" rx="20" fill="#202840"/>
      <path class="eye" d="m48 57 17 14-17 14-5-6 11-8-11-8zM74 79h26v7H74z"/>
      <rect x="61" y="111" width="28" height="19" rx="5" fill="#202840"/>
      <path class="eye" d="m65 115 7 6-7 6-2-3 4-3-4-3zM76 124h8v3h-8z"/>
    </g>
  </svg>
</button>
<button id="status" type="button">Codex Bot</button>
<script>
  const robot = document.getElementById('robot'), status = document.getElementById('status'), hide = document.getElementById('hide');
  const invoke = (action, extra = {}) => window.__TAURI__.core.invoke('desktop_bot', { action, ...extra });
  let words = null, dragging = null;
  // Use pointer capture and absolute screen coordinates: it works across monitors and fast pointer gestures.
  const moveBot = (drag) => drag.base.then((base) => invoke('move', { x: base.x + (drag.x - drag.startX) * base.scale, y: base.y + (drag.y - drag.startY) * base.scale })).catch(() => {});
  robot.addEventListener('pointerdown', (e) => {
    if (e.button !== 0) return;
    e.preventDefault(); robot.setPointerCapture(e.pointerId);
    dragging = { startX: e.screenX, startY: e.screenY, x: e.screenX, y: e.screenY, base: invoke('position') };
  });
  robot.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    dragging.x = e.screenX; dragging.y = e.screenY; moveBot(dragging);
  });
  const endDrag = (e) => {
    if (!dragging) return;
    dragging.x = e.screenX; dragging.y = e.screenY; moveBot(dragging); dragging = null;
    if (robot.hasPointerCapture(e.pointerId)) robot.releasePointerCapture(e.pointerId);
  };
  robot.addEventListener('pointerup', endDrag); robot.addEventListener('pointercancel', endDrag);
  robot.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); invoke('open').catch(() => {}); } });
  status.addEventListener('click', () => invoke('open').catch(() => {}));
  hide.addEventListener('click', () => invoke('hide').catch(() => {}));
  async function poll() {
    try {
      const data = await invoke('status'); words = data.words;
      document.documentElement.lang = data.lang || 'vi';
      document.body.dataset.state = data.waiting ? 'wait' : data.working ? 'work' : 'idle';
      robot.setAttribute('aria-label', `${words.name} · ${words.drag}`); robot.title = words.drag;
      status.textContent = data.status; status.title = words.limits;
      hide.title = words.hide; hide.setAttribute('aria-label', words.hide); hide.hidden = false;
    } catch {
      document.body.dataset.state = 'offline';
      if (words) status.textContent = words.offline;
    } finally { setTimeout(poll, 4000); }
  }
  poll();
</script>
</body>
</html>
